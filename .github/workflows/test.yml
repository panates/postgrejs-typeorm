name: Test
on:
  # `PERSONAL_ACCESS_TOKEN` is gone: every dependency here resolves from the public registry -
  # `@panates/*` included - and there is no .npmrc, so the token had nothing to authenticate.
  workflow_call:

  # Can be run manually
  workflow_dispatch:

  # on git push
  push:
    branches:
      - dev

# This workflow only ever reads the repository: it checks out, installs and
# runs tests. Set explicitly rather than left to the repository default,
# which is org-wide and can be widened later without anyone editing here.
permissions:
  contents: read

# Only one run per branch at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node v${{ matrix.node }}, typeorm ${{ matrix.typeorm }}, PostgreSQL v${{ matrix.postgres }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        postgres: ['16', '18']
        # Both ends of the peer range, >=0.3.0 <2. The `pg` seam is unchanged
        # across it - see doc/DRIVER-DESIGN.md §11 - so this matrix exists to
        # keep that true rather than because a difference is expected.
        typeorm: ['0.3.31', '1.1.1']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # `@v2`: `install: 'ci'` installs exactly what the lockfile pins, where `@v1` deleted
      # package-lock.json first and installed whatever resolved that morning - so what CI tested was
      # a dependency set nobody had pinned. `rman-version` replaces `@v1`'s unpinned global install,
      # and is the floating major rather than an exact version.
      - name: Setup Environment
        uses: panates/gh-setup-node@v2
        with:
          node-version: ${{ matrix.node }}
          rman-version: '2'
          install: 'ci'

      - name: Install the typeorm version under test
        run: npm install --no-save typeorm@${{ matrix.typeorm }}

      # **The preset's own commands, not npm scripts.** `lint` and `check` were root scripts; they
      # are commands `@panates/rman-preset` contributes now, so every repository extending it spells
      # them the same way and the flags - dpdm's exit code above all, since it reports a cycle and
      # still exits 0 without one - are pinned in one place.
      - name: Run linter test
        run: rman lint

      - name: Run circular dependency test
        run: rman check

      # Was `npm run compile`, the same `tsc -b ... --noEmit` under a name that read like a build.
      # The preset contributes no typecheck command - it builds with `tsc -b` and this is the
      # no-emit half - so it stays an npm script.
      - name: Run type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run citest
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          # The date tests move the SESSION's zone themselves, so they mean
          # something whatever this is set to. It is pinned anyway so that a
          # runner whose zone happens to match the container's cannot make a
          # future test vacuous without anyone noticing.
          TZ: Europe/Istanbul

      - name: Send coverage to Coveralls
        uses: coverallsapp/github-action@v2
        # Run only once
        if: ${{ matrix.node == '22' && matrix.postgres == '18' && matrix.typeorm == '1.1.1' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
