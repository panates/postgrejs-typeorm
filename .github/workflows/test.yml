name: Test
on:
  workflow_call:
    secrets:
      PERSONAL_ACCESS_TOKEN:

  # Can be run manually
  workflow_dispatch:

  # on git push
  push:
    branches:
      - dev

# This workflow only ever reads the repository: it checks out, installs and
# runs tests. Set explicitly rather than left to the repository default,
# which is org-wide and can be widened later without anyone editing here.
permissions:
  contents: read

# Only one run per branch at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node v${{ matrix.node }}, typeorm ${{ matrix.typeorm }}, PostgreSQL v${{ matrix.postgres }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        postgres: ['16', '18']
        # Both ends of the peer range, >=0.3.0 <2. The `pg` seam is unchanged
        # across it - see doc/DRIVER-DESIGN.md §11 - so this matrix exists to
        # keep that true rather than because a difference is expected.
        typeorm: ['0.3.31', '1.1.1']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: panates/gh-setup-node@v1
        with:
          node-version: ${{ matrix.node }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Install the typeorm version under test
        run: npm install --no-save typeorm@${{ matrix.typeorm }}

      - name: Run linter test
        run: npm run lint

      - name: Run circular dependency test
        run: npm run check

      - name: Run compile test
        run: npm run compile

      - name: Run unit tests
        run: npm run citest
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          # The differential suite needs a non-zero UTC offset to be worth
          # anything: a Date written into a timestamptz column round-trips on
          # a UTC runner whatever the driver does. See doc/DRIVER-DESIGN.md §5.
          TZ: Europe/Istanbul

      - name: Send coverage to Coveralls
        uses: coverallsapp/github-action@v2
        # Run only once
        if: ${{ matrix.node == '22' && matrix.postgres == '18' && matrix.typeorm == '1.1.1' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
