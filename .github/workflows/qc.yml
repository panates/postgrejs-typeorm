name: Quality Check
on:
  # Can be run manually
  workflow_dispatch:

  # on pull request
  push:
    branches-ignore:
      - main
      - dev

# Only one run per branch at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The called workflow only checks out and runs quality checks, and a called
# workflow inherits the caller's permissions, so the token is pinned to read
# here rather than inherited from the repository default.
permissions:
  contents: read

jobs:
  qc:
    uses: panates/github-actions/.github/workflows/node-qc.yaml@v3
    with:
      # The default is `npm run qc`, and that script is gone: `lint` and `check` are rman commands
      # now, so a root script wrapping them was exactly the kind the migration deletes. Named here
      # instead, which is where the one caller that wants it can see it.
      qc_script: 'rman lint && rman check'
    # PERSONAL_ACCESS_TOKEN dropped: the called workflow wants it only for npm.pkg.github.com, and
    # nothing here resolves from there.
